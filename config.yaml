# One configuration for all 18 models and both annotation budgets.
paths:
  data_root: data/S1S2_LC8_Robust
  assets_root: assets
  output_root: outputs
shared:
  implementation_version: dagpid-20261014
  data:
    dataset: s1s2_lc8_tiff
    batch_size: 64
    val_batch_size: 64
    num_workers: 10
    persistent_workers: true
    prefetch_factor: 3
    pin_memory: true
    drop_last: true
    filter_missing_files: false
    augment: true
  model:
    scan_backend: mamba
    num_classes: 8
    adapter_rank: 64
    decoder_channels: 192
    freeze_backbone: true
    reliability_hidden: 192
    graph_context_dim: 32
    uncertainty_gamma: 1.0
    external_priors:
      local_stem: true
      dagpid_fusion:
        integral_gain: 0.35
        derivative_gain: 0.78
        cluster_ssm:
          ssm_dim: 192
          cluster_hw: 4
          temperature: 0.08
          depth: 1
        gate_warmup_start_epoch: 1
        gate_warmup_epochs: 10
        initial_gate_bias:
          sar: 0.0
          optical: 0.0
          joint: 0.45
          dinov3: -1.1
          local: -0.55
          cf_sar: -0.75
          cf_optical: -0.75
        final_gate_bias:
          sar: 0.0
          optical: 0.0
          joint: 0.05
          dinov3: 0.0
          local: 0.08
          cf_sar: 0.02
          cf_optical: 0.02
        graph_alpha_init: 0.04
        graph_risk_beta_init: 0.08
        graph_gate_scale_init: 0.18
        feature_graph:
          nodes:
          - sar
          - optical
          - joint
          - dinov3
          - local
          - cf_sar
          - cf_optical
          - conflict
          - boundary
          topology:
          - sar
          - optical
          - dinov3
          - local
          - cf_sar
          - cf_optical
          - joint
          - conflict
          - boundary
          state_dim: 96
          delta_rank: 32
          init_logit: -4.5
          prior_logit: 1.6
          delta_scale: 0.12
          integral_bottleneck_dim: 192
      boundary_decoder:
        risk_dim: 96
        risk_downsample: 4
      local_tokens:
        enabled: true
        encoder: vss_lite
        in_channels: 14
        stem_dim: 96
        vss_dim: 192
        depth: 2
        patch_size: 8
        ssm_inner_dim: 192
      dinov3:
        enabled: true
        model_dir: ${ASSETS_ROOT}/third_party/dinov3-vitl16-pretrain-sat493m
        repo_dir: ${ASSETS_ROOT}/third_party/dinov3-main
        input_size: 224
        rgb_indices:
        - 3
        - 2
        - 1
        out_dim: 768
        freeze: true
        use_checkpoint: false
        spectral_residual_scale: 0.0
        train_spectral_residual: false
      complementary:
        enabled: true
        hidden_dim: 384
        scale_init: 0.45
    croma_input_norm: false
  loss:
    ignore_index: 255
    class_weights: null
    complementary_weight: 0.02
    graph_prior_weight: 0.0003
    graph_sparsity_weight: 1.0e-05
    schedule:
      complementary_start_epoch: 1
      complementary_ramp_epochs: 6
      graph_prior_start_epoch: 3
      graph_prior_ramp_epochs: 8
      graph_sparsity_start_epoch: 3
      graph_sparsity_ramp_epochs: 8
  optimizer:
    no_decay_weight_decay: 0.0
    lr: 7.5e-05
    weight_decay: 0.05
  scheduler:
    name: warmup_cosine
    warmup_epochs: 5
    min_lr_ratio: 0.02
  train:
    epochs: 100
    amp: bf16
    grad_clip: 1.0
    grad_accum_steps: 1
    cutmix_alpha: 1.0
    early_stopping_patience: 0
    early_stopping_min_delta: 0.0
    progress_interval: 50
    progress_train_metrics: true
    find_unused_parameters: true
    cutmix_prob: 0.03
    class_weighting: inverse_sqrt
    checkpoint_selection: best
    validation_boundary: false
labels:
  100:
    train_manifest: train.csv.gz
    label_ratio: 1.0
  10:
    train_manifest: train_10.csv.gz
    label_ratio: 0.1
